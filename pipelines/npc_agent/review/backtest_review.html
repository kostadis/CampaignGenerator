<title>Backtest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one section per target scene. What the agent was asked, what it did
   (flagged sentences marked), what actually happened, then the GM's scores. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --sunk: #e8edeb;
  --fg: #1c2624;
  --muted: #5b6966;
  --line: #d3dcd9;
  --accent: #2a6b64;
  --accent-ink: #ffffff;
  --flag: #9a6408;
  --flag-bg: #f7e9c8;
  --warn: #8c4646;
  --font-display: "Spectral", "Iowan Old Style", Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121918; --surface: #1a2321; --sunk: #222d2b; --fg: #e3ebe8; --muted: #9aaba6;
    --line: #33413e; --accent: #62b3a9; --accent-ink: #0d1514; --flag: #e0a63c; --flag-bg: #3b3017;
    --warn: #e08a8a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121918; --surface: #1a2321; --sunk: #222d2b; --fg: #e3ebe8; --muted: #9aaba6;
  --line: #33413e; --accent: #62b3a9; --accent-ink: #0d1514; --flag: #e0a63c; --flag-bg: #3b3017;
  --warn: #e08a8a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); margin: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.02rem; margin-top: 18px; }
.lede { color: var(--muted); max-width: 65ch; margin: 6px 0 0; overflow-wrap: anywhere; }
.mono { font-family: var(--font-mono); font-size: 0.82rem; }
.label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); padding-block: 10px; margin-top: 16px; display: flex; flex-wrap: wrap;
  gap: 8px; align-items: center; }
.bar .status { flex: 1 1 200px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.status.warn { color: var(--warn); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.target { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  margin-top: 20px; min-width: 0; }
.target > header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.box { background: var(--sunk); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap;
  overflow-wrap: anywhere; min-width: 0; }
.answer { font-family: var(--font-display); font-size: 1.02rem; line-height: 1.6; }
mark { background: var(--flag-bg); color: inherit; border-bottom: 2px solid var(--flag); border-radius: 2px; }
.flags { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
.flags li { border-left: 3px solid var(--flag); padding: 4px 0 4px 10px; min-width: 0; overflow-wrap: anywhere; }
.future { color: var(--warn); font-weight: 600; }
.beat { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 4px 10px; padding-block: 6px;
  border-top: 1px solid var(--line); }
.beat:first-child { border-top: 0; }
.beat .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; }
.pick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.q { margin-top: 14px; }
textarea { width: 100%; min-height: 4.5rem; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px; }
details { margin-top: 14px; }
summary { cursor: pointer; font-weight: 600; }
.empty { color: var(--muted); }
@media (max-width: 560px) { .beat { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 1.5rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div class="wrap">
  <h1>Backtest</h1>
  <p class="lede" id="lede"></p>
  <div class="bar">
    <span class="status" id="status" role="status">Loading…</span>
    <button class="btn primary" id="save-file">Save scores.json</button>
    <button class="btn" id="copy-yaml">Copy as YAML</button>
  </div>
  <div id="targets"></div>
</div>
<script>
"use strict";
const DATA = /*__NPC_AGENT_DATA__*/null;
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  if (!DATA || DATA.version !== 1) {
    $("targets").innerHTML = '<p class="empty">This page was written by a different version of npc_agent backtest. Run it again.</p>';
    return;
  }
  const DRAFT_KEY = "backtest-draft-" + DATA.run_id;
  const OPTS = [["yes", "Yes"], ["partly", "Partly"], ["no", "No"]];
  // scores[target] = { character, plausible, flags: {index: "real"|"not"}, note }
  const scores = {};
  for (const t of DATA.targets) scores[t.target] = { character: "", plausible: "", flags: {}, note: "" };

  $("lede").textContent = DATA.npc + " · model " + DATA.model + " · run " + DATA.run_id +
    ". Each target is a scene she attended, played from what she could know the chapter before.";

  const docPath = (target) => "scores/" + DATA.run_id + "--" + target;
  const bodyFor = (t) => Object.assign({ npc: DATA.npc, run_id: DATA.run_id, target: t, model: DATA.model }, scores[t]);

  function markAnswer(t) {
    // Wrap each flagged sentence in <mark>; the answer is escaped piece by piece.
    const spans = [];
    t.flags.forEach((f, i) => {
      const at = t.answer.indexOf(f.sentence);
      if (at >= 0) spans.push([at, at + f.sentence.length, i]);
    });
    spans.sort((a, b) => a[0] - b[0]);
    let out = "", pos = 0;
    for (const [a, b, i] of spans) {
      if (a < pos) continue;
      out += esc(t.answer.slice(pos, a)) + '<mark title="flag ' + (i + 1) + '">' + esc(t.answer.slice(a, b)) + "</mark>";
      pos = b;
    }
    return out + esc(t.answer.slice(pos));
  }

  function pick(target, field, flagIx, cur, opts) {
    return '<div class="pick">' + opts.map(([v, l]) =>
      '<button type="button" data-t="' + esc(target) + '" data-f="' + field + '"' + (flagIx !== null ? ' data-i="' + flagIx + '"' : "") +
      ' data-v="' + v + '" aria-pressed="' + (cur === v) + '">' + esc(l) + "</button>").join("") + "</div>";
  }

  function section(t) {
    const sc = scores[t.target];
    const flags = t.flags.length
      ? '<ul class="flags">' + t.flags.map((f, i) =>
          '<li><div><strong>' + (i + 1) + ".</strong> " + esc(f.detail) + (f.future ? ' <span class="future">FUTURE: after the freeze chapter</span>' : "") +
          "</div>" + pick(t.target, "flag", i, sc.flags[i] || "", [["real", "Real leak"], ["not", "Not a leak"]]) + "</li>").join("") + "</ul>"
      : '<p class="empty">No flags.</p>';
    const beats = t.actual_beats.map(([id, x]) => '<div class="beat"><span class="mono">' + esc(id.slice(id.lastIndexOf(".") + 1)) + '</span><span class="txt">' + esc(x) + "</span></div>").join("");
    return '<section class="target" id="s-' + esc(t.target) + '"><header><h2>' + esc(t.target) + " · " + esc(t.scene_title) +
      '</h2><span class="label">frozen at chapter ' + t.freeze + "</span></header>" +
      "<h3>The situation she was given</h3><div class=\"box\">" + esc(t.situation) + "</div>" +
      "<h3>What the agent did</h3><div class=\"box answer\">" + markAnswer(t) + "</div>" + flags +
      "<h3>What happened</h3><div class=\"box\">" + (beats || '<span class="empty">No beats.</span>') + "</div>" +
      "<details><summary>What she was given</summary><h3>Who she is</h3><div class=\"box\">" + esc(t.persona) +
      "</div><h3>What she knows</h3><div class=\"box\">" + esc(t.horizon) + "</div></details>" +
      '<div class="q"><strong>In character?</strong>' + pick(t.target, "character", null, sc.character, OPTS) + "</div>" +
      '<div class="q"><strong>Is what she does plausible at this point?</strong>' + pick(t.target, "plausible", null, sc.plausible, OPTS) + "</div>" +
      '<div class="q"><label for="n-' + esc(t.target) + '"><strong>Note</strong></label><textarea id="n-' + esc(t.target) + '" data-note="' + esc(t.target) + '">' + esc(sc.note) + "</textarea></div></section>";
  }

  function render() {
    // Re-render only the pick buttons, so a note being typed keeps its focus.
    if (!$("targets").children.length) { $("targets").innerHTML = DATA.targets.map(section).join(""); return; }
    const active = document.activeElement && document.activeElement.id;
    $("targets").innerHTML = DATA.targets.map(section).join("");
    if (active && $(active)) $(active).focus();
  }

  // ── persistence ─────────────────────────────────────────────────────────
  let db = null, canWrite = true, pending = new Set(), writing = false, timer = null;
  const setStatus = (t, warn) => { $("status").textContent = t; $("status").classList.toggle("warn", !!warn); };

  function saveDraftLocally() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(scores)); } catch (e) { /* no storage */ }
  }
  function changed(target) {
    saveDraftLocally();
    if (!db || !canWrite) return;
    pending.add(target);
    clearTimeout(timer);
    timer = setTimeout(flush, 700);
    setStatus("Saving…");
  }
  async function flush() {
    if (writing || !pending.size) return;
    writing = true;
    const ts = [...pending]; pending.clear();
    try {
      for (const t of ts) await db.doc(docPath(t)).set(bodyFor(t));
      setStatus("Saved");
    } catch (e) {
      if (e && e.code === "invalid_argument") { canWrite = false; setStatus("This view can read the scores but not change them.", true); }
      else { ts.forEach((t) => pending.add(t)); setStatus("Not saved yet. Retrying…", true); setTimeout(flush, 2500); }
    } finally {
      writing = false;
      if (pending.size) flush();
    }
  }
  const adopt = (t, d) => {
    scores[t] = { character: d.character || "", plausible: d.plausible || "", flags: Object.assign({}, d.flags || {}), note: d.note || "" };
  };

  (async function connect() {
    try {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (raw) { const d = JSON.parse(raw); for (const t of DATA.targets) if (d[t.target]) adopt(t.target, d[t.target]); }
    } catch (e) { /* no draft */ }
    render();
    setStatus("Connecting…");
    const c = window.claude && window.claude.use ? window.claude : null;
    try { db = c ? await c.use("db") : null; } catch (e) { db = null; }
    if (!db) { setStatus("Scores stay in this browser. Save scores.json to keep them.", true); return; }
    try {
      const user = await c.use("user");
      if (user && user.can && (await user.can("data.write")) === false) canWrite = false;
    } catch (e) { /* assume writable */ }
    let first = true;
    for (const t of DATA.targets) {
      db.doc(docPath(t.target)).onSnapshot((snap) => {
        if (snap.metadata.hasPendingWrites || pending.has(t.target)) return;
        if (snap.exists) { adopt(t.target, snap.data()); render(); }
        if (first) { first = false; setStatus(canWrite ? "Saved scores loaded" : "Read only: you can view these scores but not change them.", !canWrite); }
      }, () => setStatus("Lost the connection to saved scores. Save scores.json to keep your work.", true));
    }
  })();

  // ── export ──────────────────────────────────────────────────────────────
  function scoresFile() {
    return { npc: DATA.npc, run_id: DATA.run_id, model: DATA.model,
      targets: DATA.targets.map((t) => Object.assign({ target: t.target, freeze: t.freeze }, scores[t.target],
        { flags: t.flags.map((f, i) => ({ sentence: f.sentence, detail: f.detail, verdict: scores[t.target].flags[i] || "" })) })) };
  }
  const q = (s) => JSON.stringify(String(s));  // a JSON string is a valid YAML string
  function asYaml(f) {
    const L = ["npc: " + q(f.npc), "run_id: " + q(f.run_id), "model: " + q(f.model), "targets:"];
    for (const t of f.targets) {
      L.push("  - target: " + q(t.target), "    freeze: " + t.freeze, "    character: " + q(t.character),
        "    plausible: " + q(t.plausible), "    note: " + q(t.note));
      if (!t.flags.length) L.push("    flags: []");
      else {
        L.push("    flags:");
        for (const g of t.flags) L.push("      - sentence: " + q(g.sentence), "        verdict: " + q(g.verdict), "        detail: " + q(g.detail));
      }
    }
    return L.join("\n") + "\n";
  }

  document.addEventListener("click", async (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.t) {
      const sc = scores[b.dataset.t], v = b.dataset.v;
      if (b.dataset.f === "flag") { const i = b.dataset.i; if (sc.flags[i] === v) delete sc.flags[i]; else sc.flags[i] = v; }
      else sc[b.dataset.f] = sc[b.dataset.f] === v ? "" : v;
      render(); changed(b.dataset.t); return;
    }
    if (b.id === "save-file") {
      let dl = null;
      try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
      if (!dl) { setStatus("Saving files is not available in this view. Use Copy as YAML.", true); return; }
      try {
        await dl.save({ filename: "scores.json", data: JSON.stringify(scoresFile(), null, 2) + "\n" });
        setStatus("scores.json saved");
      } catch (e) {
        if (e && e.code === "declined") setStatus("Save cancelled");
        else if (e && e.code === "rate_limited") setStatus("A save prompt is already open.", true);
        else setStatus("Could not save the file. Use Copy as YAML.", true);
      }
      return;
    }
    if (b.id === "copy-yaml") {
      const text = asYaml(scoresFile());
      try { await navigator.clipboard.writeText(text); setStatus("YAML copied"); }
      catch (e) {
        const ta = document.createElement("textarea"); ta.value = text; ta.rows = 12; ta.id = "yaml-fallback";
        const old = $("yaml-fallback"); if (old) old.remove();
        document.querySelector(".wrap").insertBefore(ta, $("targets")); ta.select();
        setStatus("Copying is blocked here; the YAML is selected below.", true);
      }
    }
  });
  document.addEventListener("input", (ev) => {
    const t = ev.target.dataset && ev.target.dataset.note;
    if (t) { scores[t].note = ev.target.value; changed(t); }
  });
})();
</script>
