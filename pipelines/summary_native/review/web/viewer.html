<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign review</title><link rel="stylesheet" href="assets/viewer.css"></head><body><main id="app">
<header><h1 id="title">Campaign review</h1><p id="transport"></p><p id="progress" aria-live="polite">Loading…</p></header>
<section class="filters" aria-label="Queue filters"><label>Category <select id="category"><option value="all">All</option></select></label><label><input id="hide-approved" type="checkbox"> Hide approved</label><label><input id="select-all" type="checkbox"> Select all visible</label><span id="filtered"></span><span id="selected"></span><button id="save-selected" disabled>Save selected</button></section>
<ul id="queue" aria-label="Review queue"></ul><section id="detail" hidden aria-live="polite"><button id="back">Back to queue</button><h2 id="claim" tabindex="-1"></h2><p><span id="severity"></span> <span id="categories"></span></p><p id="locator"></p><p id="freshness"></p><p id="rerun"></p><section id="claim-meaning" hidden><h3>Exact proposed meaning or disposition</h3><dl id="claim-fields"></dl><p id="claim-action"></p></section><section id="identity" hidden><h3>Prepared canonical alternatives</h3><div id="identity-options"></div><button id="identity-distinct" type="button">Confirm these are distinct identities</button><p id="identity-selection"></p><p id="identity-application"></p></section><section id="document" hidden><h3>Document</h3><p id="document-digest"></p><pre id="document-text"></pre><button id="document-more" hidden>Load next section</button></section><h3>Evidence</h3><div id="evidence"></div><h3>Rationale</h3><p id="rationale"></p><fieldset><legend>Decision</legend><button data-verdict="approve">Approve</button><button data-verdict="reject">Reject</button><button data-verdict="discuss">Discuss</button></fieldset><p id="decision-selection" class="selection-status" aria-live="polite"></p><label for="note">Decision note</label><textarea id="note" rows="4"></textarea><p id="saved-note"></p><div class="save-actions"><button id="save">Save decision</button><button id="save-next">Save and next</button></div><button id="retry" hidden>Retry save</button><button id="reload" hidden>Reload latest</button><p id="save-state"></p></section>
</main><script src="assets/viewer.js" defer></script></body></html>
