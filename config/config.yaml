# D&D Campaign Session Prep — config
# Paths can be absolute (/mnt/c/Users/...) or relative to where you run prep.py

system_prompt: config/system_prompt.md

log_dir: logs/

# NOTE: EXTERNAL wiring (fivetools_data_root, rpg_library_url, dgx_endpoint,
# dgx_model) is now owned by mneme and rendered into config/wiring.yaml — read via
# campaignlib.wiring. It is intentionally NOT here: this file holds CampaignGenerator's
# INTERNAL config only (prompts, agents, documents, log_dir).

# Agent prompts for --mode pipeline
agents:
  lore_oracle: config/agents/lore_oracle.md
  encounter_architect: config/agents/encounter_architect.md
  voice_keeper: config/agents/voice_keeper.md

documents:
  - label: campaign_state
    path: docs/campaign_state.md
  - label: world_state
    path: docs/world_state.md
  - label: mechanics
    path: docs/mechanics.md
  - label: planning
    path: docs/planning.md
