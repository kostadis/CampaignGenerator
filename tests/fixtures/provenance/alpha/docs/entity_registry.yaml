version: 1
campaign: alpha
entities:
  - name: Marnix Vale
    type: npc
    aliases: [Marnix, The Keeper]
    note: keeper of the Greyfen common house
  - name: Silver Lantern
    type: item
    aliases: [The Lantern]
  - name: Torvin
    type: npc
  - name: Torvald
    type: npc

  # ── spec Story 2's acceptance Givens, pinned here on purpose ──────────────
  #
  # AS-1 (Vera -> Veyra) and AS-2 (the KP / Kostadinious non-identity note) were
  # both FALSE on the live corpus when this fixture was written: obelisk's
  # registry had no Veyra entry, and no registry anywhere contained Kazneporium
  # or Kostadinious (research D11). Entering them was a `registry add` /
  # `mark-distinct` act that FR-032 forbids this feature from performing, so it
  # was recorded as GM action items T098/T099 — and the GM ran them on
  # 2026-08-06.
  #
  # These entries stay anyway, and the reason is the point of a fixture: the
  # live corpus is regenerated by pipelines and edited by a human, so an
  # assertion that lives only there stops testing the mechanism the moment
  # someone re-runs `registry merge` or renames an entity. The mechanism is
  # proven here, where nothing drifts; the live-corpus tests assert the corpus.
  # Deleting these entries would silently un-test spec Story 2.
  - name: Veyra
    type: npc
    aliases: [Vera]
    note: the acceptance Given for Story 2 AS-1
  - name: Kazneporium Ketternopappux
    type: npc
    aliases: [KP]
    note: a gnome whose short form collides with nothing
  - name: Kostadinious the Sage
    type: npc
    note: a different person entirely, and the registry says so below

distinct:
  - [Torvin, Torvald]
  - [Kazneporium Ketternopappux, Kostadinious the Sage]
rejected_aliases:
  - [Marnix, Marnik]
  - [KP, Kostadinious the Sage]
