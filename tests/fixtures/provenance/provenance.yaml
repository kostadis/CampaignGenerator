# Pinned fixture manifest — two synthetic campaigns.
#
# Pinned on purpose. Two of spec Story 2's acceptance Givens are false on the
# live corpus (research D11), and the live corpus is regenerated by pipelines
# that will move text out from under an assertion (research D12 — incident 1's
# stale sentence is already gone). Contract tests assert the *mechanism* here,
# where nothing drifts; live-corpus tests assert the envelope separately and
# skip cleanly when ~/src/campaigns is absent.
#
# Every awkward case the real workspace contains is represented:
#
#   alpha  full-featured — all four tiers, a tier-glob overlap, an unclassified
#          file, a generated-and-hand-edited dossier, a .gitignore'd
#          working-reference file, a non-UTF-8 file, an unattributable chapter
#          file, an identity store with distinct/rejected pairs, and a
#          corrections record carrying a verified:false and a stale entry.
#   beta   deliberately impoverished — no identity store, no horizon marker, no
#          corrections record. The honest-degradation states (no-store,
#          horizon refusal, no-record) need a campaign that genuinely lacks the
#          thing rather than one that pretends to.

version: 1

campaigns:

  alpha:
    root: alpha
    tiers:
      authoritative:      ["summaries/**/*.md", "docs/chapters/*.md"]
      search_accelerator: ["docs/*_extractions/**/*.md"]
      # `docs/**/*.md` deliberately overlaps BOTH globs above. First match wins
      # by ordinal, and every additional match is recorded on the hit as
      # `tier_ambiguous` — the tool never silently picks a winner (D8).
      working_reference:  ["docs/**/*.md", "docs/*.yaml"]
      staging:            ["notes/**"]
    generated:
      - {paths: ["docs/world_state.md"], by: distill}
      - {paths: ["docs/npcs/*.md"],      by: planning, note: "--build-dossiers"}
    horizon: {latest: 2, path_pattern: 'docs/chapters/chapter_(\d+)_'}
    identity: {registry: docs/entity_registry.yaml, aliases: null}
    corrections: docs/corrections.yaml
    provenance_ranges:
      - {from: 1, to: 1,    authorship: gm-written,  note: "hand-written"}
      - {from: 2, to: null, authorship: ai-assisted, note: "not voice-reference material"}

  beta:
    root: beta
    tiers:
      authoritative:      ["summaries/**/*.md"]
      search_accelerator: []
      working_reference:  ["docs/*.md"]
      staging:            []
    generated:
      - {paths: ["docs/world_state.md"], by: distill}
    # No `horizon` key: a horizon request against beta must be REFUSED (FR-025),
    # never quietly served unfiltered.
    identity: {registry: null, aliases: null}
    corrections: null
    provenance_ranges: []
