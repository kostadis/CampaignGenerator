# Two DGX Sparks, one OpenAI-compatible endpoint.
# Both boxes serve the SAME model id (qwen3.8-flash-next) at --max-num-seqs 8,
# so no request rewriting is needed -- plain proxying is correct.

upstream sparks {
    # least_conn, NOT round-robin: LLM requests vary from seconds to minutes,
    # so round-robin would queue new work behind a box already running a long one.
    least_conn;

    server 192.168.1.147:8001 max_fails=2 fail_timeout=30s;   # spark1
    server 192.168.1.121:8001 max_fails=2 fail_timeout=30s;   # spark2
}

server {
    listen 8080;

    location / {
        proxy_pass http://sparks;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # THE SETTING THAT MATTERS. nginx defaults to a 60s read timeout; a
        # graph-extraction call takes minutes. Leave this at the default and
        # every real request dies at 60s.
        proxy_connect_timeout   10s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
        send_timeout          1800s;

        # Don't hold tokens in nginx buffers.
        proxy_buffering         off;
        proxy_request_buffering off;

        # If a box is down or dies mid-request, try the other one once.
        # Safe here: completions are stateless, so a replay costs GPU, not correctness.
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # curl http://localhost:8080/lb-health
    location = /lb-health { return 200 "lb ok\n"; add_header Content-Type text/plain; }
}
