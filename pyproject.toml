[project]
name = "campaigngenerator"
version = "0.1.0"
description = "D&D session-prep and post-session toolkit backed by the Claude API."
requires-python = ">=3.9"
dependencies = [
    "anthropic",
    "pyyaml",
    "pyperclip",
    "pyvis",
    "fastapi",
    "uvicorn",
    "requests",
    "mcp",
    "aiofiles",
]

[project.urls]
Repository = "https://github.com/kostadis/CampaignGenerator"

[project.scripts]

[project.optional-dependencies]
test = [
    "pytest",
]
openrouter = [
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campaignlib", "session_doc", "server"]
