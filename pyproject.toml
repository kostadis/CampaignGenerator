[project]
name = "campaigngenerator"
version = "0.1.0"
description = "D&D session-prep and post-session toolkit backed by the Claude API."
requires-python = ">=3.9"
dependencies = [
    "anthropic",
    "pyyaml",
    "pyperclip",
    "pyvis",
    "fastapi",
    "uvicorn",
    "requests",
    "mcp",
    "aiofiles",
    # Declared directly, not left to arrive transitively via fastapi: the
    # `provenance` package's strict (extra="forbid") config models are a CLI
    # concern and must load on a host that never installs the web server.
    "pydantic>=2",
]

[project.urls]
Repository = "https://github.com/kostadis/CampaignGenerator"

[project.scripts]
new_workspace = "pipelines.workspace.new_workspace:main"
players = "pipelines.workspace.players:main"
configure_mcp = "pipelines.workspace.configure_mcp:main"
kanka_mcp = "pipelines.integrations.kanka.kanka_mcp:main"
kanka_push = "pipelines.integrations.kanka.kanka_push:main"
kanka_sync = "pipelines.integrations.kanka.kanka_sync:main"
prep = "pipelines.session_prep.prep:main"
transform = "pipelines.session_prep.transform:main"
convert_book = "pipelines.content_ingest.convert_book:main"
fivetools_ingest = "pipelines.content_ingest.fivetools_ingest:main"
dnd_sheet = "pipelines.content_ingest.dnd_sheet:main"
sheet_frontmatter = "pipelines.content_ingest.sheet_frontmatter:main"
distill = "pipelines.grounding.distill:main"
campaign_state = "pipelines.grounding.campaign_state:main"
planning = "pipelines.grounding.planning:main"
party = "pipelines.grounding.party:main"
npc_table = "pipelines.grounding.npc_table:main"
make_tracking = "pipelines.grounding.make_tracking:main"
arc_triggers = "pipelines.grounding.arc_triggers:main"
build_recent_events = "pipelines.grounding.build_recent_events:main"
event_spine = "pipelines.grounding.event_spine:main"
thread_registry = "pipelines.grounding.thread_registry:main"
grounding_sections = "pipelines.grounding.grounding_sections:main"
normalize_bible_headings = "pipelines.grounding.normalize_bible_headings:main"
registry = "entity_registry.registry:main"
registry_mcp = "entity_registry.registry_mcp:main"
provenance = "provenance.cli:main"
provenance_mcp = "provenance.provenance_mcp:main"
spell_canon = "entity_registry.spell_canon:main"
ensemble = "pipelines.ensemble.ensemble:main"
ensemble_batch = "pipelines.ensemble.ensemble_batch:main"
ensemble_extract = "pipelines.ensemble.ensemble_extract:main"
ensemble_merge = "pipelines.ensemble.ensemble_merge:main"
calibrate_embed = "pipelines.ensemble.calibrate_embed:main"
extract_facts = "pipelines.ensemble.extract_facts:main"
narrate_chapter = "pipelines.ensemble.narrate_chapter:main"
facts_to_state = "pipelines.ensemble.facts_to_state:main"
synthesise_facts = "pipelines.ensemble.synthesise_facts:main"
synthesise_polish = "pipelines.ensemble.synthesise_polish:main"
synthesise_world_state = "pipelines.ensemble.synthesise_world_state:main"
split_chapters = "pipelines.ensemble.split_chapters:main"
polish = "pipelines.ensemble.polish:main"
summary_map = "pipelines.ensemble.summary_map:main"
rpg_retriever = "pipelines.rlm.rpg_retriever:main"
fivetools_catalog = "pipelines.rlm.fivetools_catalog:main"
dossier_proposer = "pipelines.rlm.dossier_proposer:main"
mcp_server = "pipelines.rlm.mcp_server:main"
launch_5etools_mcp = "pipelines.rlm.launch_5etools_mcp:main"
suggest_conversion = "pipelines.rlm.suggest_conversion:main"
query = "pipelines.rlm.query:main"
query_rpg_lib = "pipelines.rlm.query_rpg_lib:main"
apply_ingest_manifest = "pipelines.rlm.apply_ingest_manifest:main"
sd_consistency = "session_doc.sd_consistency:main"
sd_verify_quotes = "session_doc.sd_verify_quotes:main"
sd_agent = "session_doc.sd_agent:main"
sd_corrections = "session_doc.sd_corrections:main"
sd_plan = "session_doc.sd_plan:main"
sd_narrate = "session_doc.sd_narrate:main"
assemble = "session_doc.assemble:main"
scene_extract = "session_doc.scene_extract:main"
enhance_summary = "session_doc.enhance_summary:main"
check_consistency = "session_doc.check_consistency:main"
voice_lint = "session_doc.voice_lint:main"
vtt_voice_compare = "session_doc.vtt_voice_compare:main"
scrub_mechanics = "session_doc.scrub_mechanics:main"
scabard_sync = "scabard_sdk.scabard_sync:main"

[project.optional-dependencies]
test = [
    "pytest",
]
openrouter = [
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campaignlib", "session_doc", "server", "pipelines", "entity_registry", "scabard_sdk", "provenance"]
