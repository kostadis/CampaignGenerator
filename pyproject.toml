[project]
name = "campaigngenerator"
version = "0.1.0"
description = "D&D session-prep and post-session toolkit backed by the Claude API."
requires-python = ">=3.9"
dependencies = [
    "anthropic",
    "pyyaml",
    "pyperclip",
    "pyvis",
    "fastapi",
    "uvicorn",
    "requests",
    "mcp",
    "aiofiles",
]

[project.urls]
Repository = "https://github.com/kostadis/CampaignGenerator"

[project.scripts]
new_workspace = "pipelines.workspace.new_workspace:main"
configure_mcp = "pipelines.workspace.configure_mcp:main"
kanka_mcp = "pipelines.integrations.kanka.kanka_mcp:main"
kanka_push = "pipelines.integrations.kanka.kanka_push:main"
kanka_sync = "pipelines.integrations.kanka.kanka_sync:main"
prep = "pipelines.session_prep.prep:main"
transform = "pipelines.session_prep.transform:main"

[project.optional-dependencies]
test = [
    "pytest",
]
openrouter = [
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["campaignlib", "session_doc", "server", "pipelines"]
